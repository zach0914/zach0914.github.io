
name: Build and deploy Hugo site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.170.0
      DART_SASS_VERSION: 1.108.2

    steps:
      # 1. 下载博客源码和 Stack 主题子模块
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 配置 GitHub Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      # 3. 安装 Dart Sass
      - name: Install Dart Sass
        run: |
          mkdir -p "${HOME}/.local"
          curl -fsSL -o "${RUNNER_TEMP}/dart-sass.tar.gz" \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xzf "${RUNNER_TEMP}/dart-sass.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      # 4. 安装 Hugo
      - name: Install Hugo
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xzf "${RUNNER_TEMP}/hugo.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      # 5. 检查环境并构建网站
      - name: Build
        run: |
          hugo version
          sass --version
          git submodule status
          hugo --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # 6. 上传静态文件
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 7. 发布网站
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

